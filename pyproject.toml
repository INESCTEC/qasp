[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qasp"
version = "0.3.0"
description = "Quantum Agent Software Package for quantum circuits, optimization, classifiers, kernels, RL policies, and simulation workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "André Sequeira", email = "andre.m.sequeira@inesctec.pt" }
]
maintainers = [
  { name = "André Sequeira", email = "andre.m.sequeira@inesctec.pt" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["quantum computing", "pennylane", "QAOA", "QUBO", "quantum optimization", "quantum classification", "reinforcement learning", "quantum kernels", "policy gradients"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Tested combinations and the rationale for these bounds are recorded in
# docs/dependency_compatibility.md. The ranges are not a Cartesian test matrix.
dependencies = [
  "autograd>=1.8,<1.9",
  "gymnasium>=1.0,<1.3",
  "matplotlib>=3.10.3,<3.12",
  "numpy>=1.26.4,<2.6",
  "opt_einsum>=3.3,<4",
  "pandas>=2.2.3,<3.2",
  "pennylane>=0.42.3,<0.46",
  "ray[rllib]>=2.46,<2.61",
  # SciPy 1.15.2/1.15.3 CPython 3.10 arm64 wheels fail to load on macOS 27.
  "scipy>=1.14.1,<1.15; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version < '3.11'",
  "scipy>=1.14.1,<1.19; sys_platform != 'darwin' or platform_machine != 'arm64' or python_version >= '3.11'",
  "tensordict>=0.7.2,<0.15",
  "torch>=2.6,<2.16",
  "torchrl>=0.7.2,<0.15",
]

[project.optional-dependencies]
preview = ["ipython>=8"]
dev = [
  "ipykernel",
  "pytest",
  "ruff",
  "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/INESCTEC/qasp"
Repository = "https://github.com/INESCTEC/qasp"
Documentation = "https://andre-sequeira10.github.io/QASP/"
Issues = "https://github.com/INESCTEC/qasp/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["qasp", "qasp.*"]
exclude = ["tests", "tests.*", "__MACOSX", "__MACOSX.*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.ipynb", "__pycache__/*", "*.pyc"]
